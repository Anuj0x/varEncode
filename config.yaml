# Modern DVAE Configuration
defaults:
  - _self_

# Data configuration
data:
  dataset: mnist  # mnist or cifar10
  data_dir: ./data
  batch_size: 128
  num_workers: 4
  validation_split: 0.1

# Model configuration
model:
  latent_dim: 50  # 50 for MNIST, 100 for CIFAR-10
  hidden_dims: [384, 192]  # [512, 256] for CIFAR-10
  channels: [64, 64]  # [128, 64] for CIFAR-10
  denoising: true  # true for DVAE, false for VAE

# Training configuration
training:
  max_epochs: 100
  learning_rate: 1e-3
  weight_decay: 1e-5
  lr_scheduler:
    decay_step: 0.1
    decay_factor: 0.1
  samples: 1  # Number of posterior samples

# Experiment tracking
logging:
  project_name: "dvae-modern"
  run_name: null  # Auto-generated if null
  log_every_n_steps: 100
  save_top_k: 3
  monitor_metric: "val_loss"

# Hardware
hardware:
  accelerator: auto  # auto, gpu, cpu
  devices: auto  # auto, 1, 2, etc.
  precision: 32  # 16, 32, 64
